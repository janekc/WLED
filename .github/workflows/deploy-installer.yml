name: Build and Deploy Web Installer

on:
  push:
    branches: [fastfertig]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Build Web UI
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: |
          pip install -r requirements.txt esptool

      - name: Build Firmware
        run: pio run -e custom_build

      - name: Create Factory Binary and Prepare Site
        run: |
          mkdir -p site
          cp installer/index.html site/
          cp installer/manifest.json site/

          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32/ -name "boot_app0.bin" | head -n 1)

          # Merge bootloader, partitions, boot_app0, and firmware into a single factory image
          python3 -m esptool --chip esp32 merge-bin \
            -o site/firmware_factory.bin \
            --flash-mode dio --flash-freq 40m --flash-size 4MB \
            0x1000 .pio/build/custom_build/bootloader.bin \
            0x8000 .pio/build/custom_build/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/custom_build/firmware.bin

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
