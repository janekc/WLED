[platformio]
default_envs = custom_build

[env:custom_build]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods} four_line_display_ALT rotary_encoder_ui_ALT

lib_deps = ${env:esp32dev.lib_deps}
  olikraus/U8g2 # @~2.34.4
  Wire

build_flags = ${env:esp32dev.build_flags}
   -D WLED_BRAND='"fastfertig"'
   -D SERVERNAME="\"fastfertig\""
   -D WLED_AP_SSID='"fastfertig"'
   -D WLED_AP_SSID_UNIQUE
   -D DEFAULT_COLOR=0xFF0000
   -D ABL_MILLIAMPS_DEFAULT=0
   -D WLED_AP_PASS='"eswerdelicht"'
   -D WLED_USE_ETHERNET
   -D WLED_ETH_DEFAULT=4
   -D BTNPIN=15
   -D DATA_PINS=16
   -D DEFAULT_LED_PIN=16
   -D DEFAULT_LED_COUNT=236
   -D PIXEL_COUNTS=236
   -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_GRB
   -D I2CSDAPIN=4
   -D I2CSCLPIN=32
   -D HW_PIN_SDA=4
   -D HW_PIN_SCL=32
   -D UM_AUDIOREACTIVE_ENABLE
   -D FLD_TYPE=SSD1306_64
   -D USERMOD_ROTARY_ENCODER_GPIO=INPUT
   -D ENCODER_DT_PIN=33
   -D ENCODER_CLK_PIN=34
   -D ENCODER_SW_PIN=36
