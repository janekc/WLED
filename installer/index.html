<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WLED Fastfertig Web Installer</title>
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
    ></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #181818;
        color: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .card {
        background: #242424;
        padding: 32px;
        border-radius: 12px;
        max-width: 460px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin-top: 0;
        color: #ff4d4d;
      }
      p {
        color: #aaa;
        line-height: 1.5;
      }
      esp-web-install-button {
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>WLED Fastfertig</h1>
      <p>
        Connect your ESP32 to USB and click Install (requires Chrome, Edge, or
        Opera on desktop).
      </p>
      <esp-web-install-button manifest="manifest.json">
        <button
          slot="activate"
          style="
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            background: #e50914;
            color: white;
            border: none;
            font-weight: bold;
          "
        >
          Install WLED Fastfertig
        </button>
        <span slot="unsupported"
          >Your browser does not support Web Serial. Please use Chrome or
          Edge.</span
        >
      </esp-web-install-button>
    </div>
  </body>
</html>
